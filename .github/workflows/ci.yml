name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none

      - run: composer install --prefer-dist --no-progress

      - run: composer test

      # The SDK must install with no dependencies beyond the extensions it
      # declares, because a plugin sits next to arbitrary other PHP code.
      - name: Check the SDK has no runtime dependencies
        run: |
          composer install --no-dev --prefer-dist --no-progress
          test ! -d vendor/psr && test ! -d vendor/guzzlehttp
